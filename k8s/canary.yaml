# Canary Deployment
# 80% traffic → stable (4 replicas), 20% traffic → canary (1 replica)
# Both share the same service selector label (app: aceest-fitness).
# Monitor canary health, then scale up canary and remove stable.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_PATH
              value: /tmp/aceest_fitness.db
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:NEW_TAG
          ports:
            - containerPort: 5000
          env:
            - name: DB_PATH
              value: /tmp/aceest_fitness.db
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  namespace: aceest
spec:
  selector:
    app: aceest-fitness   # routes to both stable + canary pods
  ports:
    - port: 80
      targetPort: 5000
  type: NodePort
